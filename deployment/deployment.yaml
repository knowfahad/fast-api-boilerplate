apiVersion: apps/v1
kind: Deployment
metadata:
  name: fahad
  labels:
    app: fahad
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fahad
  template:
    metadata:
      labels:
        app: fahad
    spec:
      containers:
        - name: api
          image: "<IMAGE PLACEHOLDER>"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: fahad-config
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
